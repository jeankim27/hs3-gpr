# =============================================================================
#  HS-3 GPR · VARIABLE REGISTER
#  The ONE place numbers are typed. Code, notebooks, BUDGET.md and the website
#  all read this file. Never hard-code a number anywhere else.
# =============================================================================
#
#  HOW TO EDIT (on GitHub: open this file → pencil icon → "Commit changes")
#    1. Find the variable by its key (e.g. f_center).
#    2. Change `value` (SI units) and, if it changed, `status` and `source`.
#    3. Open a pull request. Checks run automatically; a teammate reviews.
#
#  FIELDS
#    name      Plain-English name
#    symbol    Symbol used in docs/equations.md
#    value     Number in SI units (write 20e6 or 20000000), text, a list, or null while TBD
#    unit      Hz, m, s, W, K, dB, dBi, deg, bit, bit/s, B (bytes), kg, U, or "-" (none)
#    range     [min, max] being considered (optional)
#    status    TBD      → no value yet
#              assumed  → placeholder or estimate; needs a source or a trade
#              derived  → backed by an analysis (cite the notebook, EQ-ID or TS-ID)
#              frozen   → agreed baseline; change only with a decision record (DR-xxx)
#    quarter   Q1 | Q2 | Q3 — when it must be pinned down
#    group     Category (used to group tables)
#    owner     GitHub username, or a role until people are assigned:
#              systems | radar-hw | scene | processing | comms | eps | gnc | structures
#    source    Citation key from refs/references.bib, EQ-ID, TS-ID, DR-ID, notebook, or "team"
#    drives    What this variable affects
#    notes     Anything else
#
#  ADD A VARIABLE: copy any block, give it a new key (lowercase_with_underscores),
#  fill the fields, and run `python tools/register.py` (or let the checks do it).
# =============================================================================

